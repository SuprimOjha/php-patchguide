name: Official PHP archive snapshot
on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_official_feed.py --output php-feed-snapshot.json
      - uses: actions/upload-artifact@v4
        with:
          name: official-php-feed-snapshot
          path: php-feed-snapshot.json
          retention-days: 30
