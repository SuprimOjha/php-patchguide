[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "php-patchguide"
version = "0.2.0"
description = "Read-only PHP security advisory checks and remediation reports"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["php", "security", "advisory", "cli", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/SuprimOjha/php-patchguide"
Repository = "https://github.com/SuprimOjha/php-patchguide"
Issues = "https://github.com/SuprimOjha/php-patchguide/issues"
Changelog = "https://github.com/SuprimOjha/php-patchguide/blob/main/CHANGELOG.md"

[project.scripts]
patchguide = "patchguide.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchguide = ["data/advisories/*.json"]
