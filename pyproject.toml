[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "php-patchguide"
version = "0.1.0"
description = "Read-only PHP security advisory checks and remediation reports"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
[project.scripts]
patchguide = "patchguide.cli:main"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
